[project]
name = "astrbot-imessage-adapter"
version = "1.2.1"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.11.18,<4", "filelock>=3.18.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
